name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    # Fake values for import-time env reads — no real keys are ever used in CI.
    env:
      PRIMARY_LLM_PROVIDER: groq
      FALLBACK_LLM_PROVIDER: groq
      GROQ_API_KEYS: test-key-not-real
      LLM_MODELS: llama-3.3-70b-versatile
      ANTHROPIC_API_KEY: test-anthropic-key-not-real
      LANGCHAIN_TRACING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: |
          pip install black
          black --check src tests

      - name: Mypy (type check)
        # Informational: the code isn't fully typed yet. Don't fail the build
        # over it, but still surface issues for reviewers.
        run: mypy src || true

      - name: Pytest
        run: pytest tests/ -ra --strict-markers --cov=src --cov-report=term-missing

      - name: Upload coverage (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: ignore

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: biomed-troubleshooter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
